    <!-- Header -->
    <header>
        <div class="container">
            <div class="row">
                <div class="col-lg-12">
                    <!--Kev: profile pic meteor trick via pure svg :)-->
                    <!--To suuport Microsoft Edge v13 or later--> 
                    <!--Thanks to David Storey, Edge's project manager assured us that native support for external content in SVGs -> https://twitter.com/dstorey/status/626514631884804096> -->
                    <svg viewBox="0 0 160 160" width="260" height="260">
                      <clipPath id="cut-off-bottom">
                        <circle cx="80" cy="80" r="100" />
                      </clipPath>
                      <image x="25" y="25" xlink:href="img/profile.png" height="120" width="120" clip-path="url(#cut-off-bottom)" ></image>

                      <g transform="matrix(0.966, -0.5, 0.25, 0.433, 80, 80)">
                        <path d="M 0,70 A 65,70 0 0,0 65,0 5,5 0 0,1 75,0 75,70 0 0,1 0,70Z" fill="#FFF">
                          <animateTransform attributeName="transform" type="rotate" from="360 0 0" to="0 0 0" dur="1s" repeatCount="indefinite" />
                        </path>
                      </g>
                      <path transform="matrix(0.866, -0.5, 0.5, 0.866, 80, 80)" />
                    </svg>

                    <div class="intro-text">
                        <span class="name">{{ site.name }}</span>
                        <hr class="star-light">
                        <span class="skills">New - York - Software - Engineer</span>
                    </div>
                </div>
            </div>
        </div>
    </header>
